<svg xmlns="http://www.w3.org/2000/svg" viewBox="17.50 32.02 479.75 400.55">
	<!-- Unseen (the Fox's Catlike, the Ranger's Stalker: hidden until you attack or move), standing
	     beside the name plate in the character sheet header the way the Lightbearer's candle and the
	     Judge's scales do. Painted as a CSS MASK, so only the ALPHA of this file matters: the shape is
	     the hole the colour shows through.

	     An empty hood with only the eyes showing: somebody is there, and you cannot see who.

	     TWO departures from the game-icons.net original, both to the CANVAS - the drawing itself is
	     untouched geometry. They are the same two candle-light.svg makes, for the same reasons; see
	     that file for the long form.

	     One: the opaque black backing plate is gone. As a mask an opaque plate passes 100% of its
	     own box, so the header would render a solid slab that still lays out, hovers and clicks,
	     with nothing logged anywhere. If this icon ever reads as a filled rectangle, that is why.

	     Two: the 0 0 512 512 canvas is CROPPED to the drawing's own bounding box (measured off the
	     path, beziers solved rather than eyeballed: x 17.50-497.25, y 32.02-432.57). Cropped, the
	     box IS the drawing, so `mask-size: contain` centres the glyph against the name plate
	     instead of merely placing it near one - and the element's `aspect-ratio` is this viewBox's
	     own 479.75 / 400.55. Re-importing the upstream file undoes both; redo them if you do. -->
