<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="height: 512px; width: 512px;">
	<!-- The Arcana tab's rail glyph: the same triple spiral as assets/icons/arcanum.svg, with
	     the dark octagon token dropped. Every rail icon is worn as a CSS mask, so only the
	     glyph may carry alpha — the octagon is an opaque fill and would mask as a solid slab.
	     The transparent background square below matches the shape of every other rail icon.

	     Arm geometry is byte-identical to arcanum.svg (see that file's comment for the
	     Archimedean recipe, the handedness, and why the pitch and cap clearances are what they
	     are). Two things differ, both because there is no octagon left to fit inside:

	     - Scaled 1.6 about the INKED bounding box, not the viewBox centre. arcanum.svg holds the
	       arms to an outer radius of 162 of 256 so they clear the octagon's chamfered corners;
	       with the token gone that reads small beside neighbours like school-bag.svg, which fill
	       the frame. The three arms are not concentric with the frame either — stroke included,
	       they occupy 98..387.6 x 100..394.4, a box centred on (242.8, 247.2) and only 290 wide
	       of the 512 square. Recentring that box and scaling it 1.6 puts the glyph at 235 of 256
	       in its longer axis, which is the 21..491 extent the game-icons.net exports beside it
	       share (info.svg is a disc of exactly that radius). The rail wears the whole viewBox as
	       a `contain` mask, so this ratio is what decides the drawn size inside the 20px box:
	       before, the mark rendered ~14px against its neighbours' ~18.
	       Scale is uniform, so the band and the gaps between the arms grow together — the pitch
	       clearances the geometry was built for are untouched.
	     - Stroked #fff rather than #f0ece3. Colour is irrelevant under an alpha mask — what
	       matters is that it is opaque — and #fff is what the game-icons.net exports beside it
	       use, so the whole folder reads the same way. The rail tints it from CSS. -->
	<path d="M0 0h512v512H0z" fill="#ffffff" fill-opacity="0"/>
	<g transform="translate(256,256) scale(1.6) translate(-242.8,-247.2)">
		<g fill="none" stroke="#fff" stroke-width="31" stroke-linecap="round">
			<path d="M256 256C278.2 258.5 300.4 251.6 316.4 238.6C332.4 225.6 342.1 206.6 343.8 187.8C345.6 168.9 339.4 150.5 328.3 137.4C317.1 124.3 301.3 116.7 285.8 115.6C270.4 114.6 255.6 120.1 245.4 129.4C235.3 138.6 229.7 151.4 229.4 163.5C229.1 175.5 234 186.6 241.3 193.9C248.7 201.1 258.4 204.5 267 204.1C275.7 203.7 283.1 199.6 287.5 194.1C291.8 188.6 293.1 182 292 176.7"/>
			<path d="M256 256C242.8 274 237.6 296.6 240.9 317C244.2 337.4 255.7 355.3 271.2 366.2C286.6 377.1 305.7 381 322.6 377.9C339.5 374.8 354 364.9 362.6 352C371.2 339.2 373.9 323.6 371 310.2C368 296.7 359.7 285.6 349.4 279.3C339.2 273 327.1 271.6 317.2 274.3C307.2 277.1 299.4 283.8 295.4 291.5C291.5 299.2 291.3 307.7 293.9 314.2C296.4 320.7 301.5 325.1 306.7 326.8"/>
			<path d="M256 256C247 235.5 230 219.8 210.7 212.4C191.5 205.1 170.2 206.1 153 214C135.8 221.9 122.9 236.5 117.1 252.7C111.4 268.9 112.7 286.5 119.5 300.3C126.4 314.2 138.5 324.3 151.6 328.5C164.7 332.7 178.6 331 189.1 325.3C199.7 319.5 206.9 309.8 209.5 299.8C212.2 289.8 210.2 279.7 205.6 272.4C200.9 265.1 193.6 260.7 186.7 259.7C179.7 258.7 173.4 260.9 169.4 264.5"/>
		</g>
	</g>
</svg>
