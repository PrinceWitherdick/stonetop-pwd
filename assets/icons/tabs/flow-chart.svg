<!-- Core Loop tab glyph: three boxes wired into a cycle, drawn for this project (see
     ATTRIBUTION.md). Worn as a CSS mask, so the background square is transparent and only the
     glyph carries alpha.

     Plain geometry, nothing to re-derive. Three 296x104 boxes at x 152..448, stacked at y 32,
     204 and 376, each drawn as an outer rounded rect plus an inner one wound the OTHER way, so
     nonzero fill leaves a 16-unit wall and an empty middle without needing fill-rule. Two
     connectors run down the centre line (x 300) from box to box, and a return leg runs from the
     bottom box out to a rail at x 56, up the left side, and back into the top box. Every
     connector ends in a solid triangular head, and the loop's head is the one on the return leg:
     the cycle reads bottom-back-to-top, which is the direction the diagram it stands for goes. -->
