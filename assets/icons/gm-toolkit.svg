<!-- The GM Toolkit actor's portrait: a reader behind an open book, which is what that sheet is.
     The toolkit is the GM playbook on screen, so its mark is somebody reading one.

     Sourced from game icons dot net ("read", by Skoll), CC BY 3.0, artwork unchanged. Only the
     ground under it is ours. Credited in this folder's ATTRIBUTION.md, which is what that
     licence asks for.

     Read the same way round as the Book I creature type marks in assets/icons/bestiary/ and the
     follower marker in assets/icons/followers/: a black field with the drawing standing in
     cream, over a cream disc that shows past the field as a hairline rim. So the two GM side
     singletons and a shelf of creature actors read as one set. That rim is not decoration:
     Foundry's sidebar sits on a dark ground, where a plain black disc loses its edge.

     Recipe: three pieces on a 1600x1600 canvas, all centred on (800, 800). A cream disc at
     r=723.45, a black field at r=712.60 (the same 10.85 rim the Book I marks leave), and the
     icon's single path in cream on top.

     Size. The drawing square is the largest that fits inside the disc (side = r * root 2 =
     1023.11), brought in by 16 units, 2px, from there: 1007.11. The source's INK is fitted to
     that, not its 512 viewBox, which is where this departs from followers/new shoot.svg. That
     file carries a Font Awesome glyph whose ink IS its whole viewBox; game icons art is drawn
     with margins inside its square (this one measures 470.11 by 428.45), so fitting the viewBox
     would have handed back a mark 8 percent smaller than every sibling for no reason anyone
     could see. Scale is therefore 1007.11 / 470.11 = 2.14229.

     Position. No nudge, unusually: the ink box is already centred on (256, 256) in the source,
     so translating by that alone hangs it true. The widest points (the two hands) sit 545.5 from
     centre and the book's bottom point 458.9, both well inside the 712.60 field, which is what
     keeps the mark off the rim at sidebar sizes.

     One trap, learned the hard way: an XML comment may not contain two hyphens in a row. An SVG
     loaded through <img> is parsed strictly, so a stray pair anywhere above makes the whole file
     fail to render, and it fails as a broken image rather than as a warning. Set any aside in
     this comment with commas or parentheses instead. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="200" height="200" role="img" aria-label="GM Toolkit"><circle cx="800" cy="800" r="723.45" fill="#f0ece3"/><circle cx="800" cy="800" r="712.60" fill="#000"/><g transform="translate(800 800) scale(2.14229) translate(-256 -256)"><path fill="#f0ece3" d="M204.055 213.905q-18.12-5.28-34.61-9a145.92 145.92 0 0 1-6.78-44.33c0-65.61 42.17-118.8 94.19-118.8 52.02 0 94.15 53.14 94.15 118.76a146.3 146.3 0 0 1-6.16 42.32q-20.52 4.3-43.72 11.05c-22 6.42-39.79 12.78-48.56 16.05-8.72-3.27-26.51-9.63-48.51-16.05zm-127.95 84.94a55.16 55.16 0 1 0 55.16 55.15 55.16 55.16 0 0 0-55.16-55.15zm359.79 0a55.16 55.16 0 1 0 55.16 55.15 55.16 55.16 0 0 0-55.15-55.15zm-71.15 55.15a71.24 71.24 0 0 1 42.26-65v-77.55c-64.49 0-154.44 35.64-154.44 35.64s-89.95-35.64-154.44-35.64v74.92a71.14 71.14 0 0 1 0 135.28v7c64.49 0 154.44 41.58 154.44 41.58s89.99-41.55 154.44-41.55v-9.68a71.24 71.24 0 0 1-42.26-65z"/></g></svg>
