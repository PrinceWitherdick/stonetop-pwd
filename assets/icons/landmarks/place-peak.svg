<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The marker a MOUNTAIN wears: the two ranges the World's End map letters across itself, and
    the two places on it that are themselves mountains rather than settlements.

    Artwork: game-icons.net "peaks" by Lorc (CC BY 3.0), outline unchanged. Ours is the colour
    only, the same cream (#f2e6c8) and ink (#33281e) as the teardrop marker, the signpost and
    the lettered discs beside them, so every pin on one table's maps reads as one set.

    WHY A RANGE MAY WEAR A DRAWING WHEN THE GREAT WOOD MAY NOT. The sibling file
    place-region.svg is deliberately blank, because a teardrop on a region says something false:
    a pin asserts a POINT, and the Great Wood is not at one. This drawing asserts no point. It
    is a terrain symbol, the thing a hand-drawn map letters across its hills anyway, and what it
    claims is "mountains", which is true of the Whitefang Mountains along their whole arc and
    true of Huffel Peaks along theirs. Tor's Fist and Barrier Pass take it for the same reason
    read the other way round: both ARE points, and both are points made of mountain, so the
    drawing that names the country also names them.

    Same construction notes as place-marker.svg, and for the same reasons: the game-icons
    backing square is deleted rather than made transparent, because it carries no fill of its
    own and so paints an opaque black tile on the map behind the drawing; the viewBox stays a
    512 square because Foundry's ControlIcon stretches whatever it is given to a square of the
    note's iconSize; and the stroke is heavy so cream does not sink into brown line art.

    The stroke is 14 where its two siblings are 20, which is the one place this file departs
    from them, and it is not a smaller pen. Those two are single silhouettes drawn barely half
    the width of the box; this is a range drawn 473 of 512 wide with five inner folds packed
    into it, so a stroke that reads as one clean line around a teardrop reads as a dark mass
    across mountains, and the inner peaks close up at the 70px these ship at. 14 is the weight
    that holds the folds open and still reads as the same nib. Checked by rendering, not by
    arithmetic: see tests/utils/map-pins.test.js.

    This one stands on the FOOT of the range, at y = 452.08 of the viewBox plus half the
    stroke. module/utils/map-pins.js reads that to set the mountains down on the spot rather
    than floating them half a glyph above it.
  -->
  <path fill="#f2e6c8" stroke="#33281e" stroke-width="14" stroke-linejoin="round"
        d="M245.795 19.12l-52.363 153.513 26.67 61.937 38.884-52.37 53.217 67.493 11.682-40.486-78.09-190.086zM101.172 193.69l-29.06 80.222 24.54-12.715 24.803 14.33 11.64-48.013-31.923-33.825zm83.267 5.308l-20.776 60.904-15.27-16.177-14.662 60.48-37.568-21.707-33.44 17.324L19.04 420.42l84.884 30.937 73.418-22.437 73.935 19.47 71.66-21.536 91.973 25.226 77.28-31.66-48.44-89.006-39.045 26.664-38.892-27.576-27.153 42.79-15.78-10.013 39.032-61.51-26.6-64.752-15.246 52.83-60.634-76.9-43.664 58.81-31.33-72.76zm223.06 65.81L375.84 314.7l29.066 20.61 29.865-20.394-27.27-50.11z"/>
</svg>
