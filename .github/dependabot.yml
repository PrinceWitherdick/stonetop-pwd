version: 2

# Two ecosystems, both monthly. This repository has no runtime dependencies at all (a Foundry
# system ships as plain ES modules with no build step), so everything below is tooling: the
# test runner, the linter, and the actions the two workflows call.
#
# The github-actions entry is the one that earns its keep. release.yml pins its actions by
# commit SHA, because a floating tag on the step that decides what every installed world
# downloads is mutable by definition. A SHA pin does not float, which is the point, but it also
# means it never picks up a security fix on its own. Dependabot rewrites the SHA and the trailing
# `# v3.0.2` comment together, which is what keeps a pin from quietly rotting into an old one.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "[Chore]"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Deliberately low. These are dev dependencies on a single-maintainer repo, and a wall of
    # open PRs is how this feature stops being read at all.
    open-pull-requests-limit: 3
    # Grouping is what makes that cap survivable. There are seven devDependencies and no
    # runtime ones, so in a month where eslint, vitest and globals all move, three separate
    # PRs spend the whole budget and hide anything else that was waiting. One PR whose entire
    # claim is "the tooling moved" is cheaper to read, and cheaper to revert, than three.
    #
    # Scoped to development on purpose rather than a bare `patterns: ["*"]`. There are no
    # runtime dependencies today, and the day one arrives it should turn up in a PR of its
    # own: it is the only kind of update here that changes what users actually run.
    #
    # github-actions above is deliberately NOT grouped. Those pins get read one at a time,
    # because each one is a decision about what code runs holding a writable token.
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]
    commit-message:
      prefix: "[Chore]"
